name: android-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK r29
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;29.0.14206865" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --locked
      - name: Build APK
        working-directory: crates/mg-android
        run: cargo apk2 build
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: material-geek-apk
          path: crates/mg-android/target/**/*.apk

  apk-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK r29
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;29.0.14206865" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --locked
      - name: Restore release keystore from secrets
        working-directory: crates/mg-android
        run: echo "${{ secrets.MATERIAL_GEEK_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
      - name: Build signed release APK
        working-directory: crates/mg-android
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ github.workspace }}/crates/mg-android/release.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.MATERIAL_GEEK_KEYSTORE_PASSWORD }}
        run: cargo apk2 build --release
      - name: Verify release signature
        run: |
          APK=$(find crates/mg-android/target -name '*.apk' | head -n 1)
          echo "APK=$APK"
          test -n "$APK"
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: material-geek-apk-release
          path: crates/mg-android/target/**/*.apk
