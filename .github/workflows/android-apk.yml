name: android-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK r29
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;29.0.14206865" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --locked
      - name: Build APK
        working-directory: crates/mg-android
        run: cargo apk2 build
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: material-geek-apk
          path: crates/mg-android/target/**/*.apk
