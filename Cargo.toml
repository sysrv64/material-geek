[workspace]
members = [
    "crates/mg-tokens",
    "crates/mg-motion",
    "crates/mg-theme",
    "crates/mg-components",
    "crates/mg-demo",
    "crates/mg-render",
    "crates/mg-android",
]
resolver = "2"

[patch.crates-io]
winit = { git = "https://github.com/sysrv64/winit", branch = "android-destroy-close-request" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sysrv64/material-geek"
rust-version = "1.86"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
glyphon = "0.12"
cosmic-text = "0.19"
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = "30"
mg-tokens = { path = "crates/mg-tokens" }
mg-motion = { path = "crates/mg-motion" }
mg-theme = { path = "crates/mg-theme" }
mg-components = { path = "crates/mg-components" }
mg-render = { path = "crates/mg-render" }

